<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>LB CRM</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffffff">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">


<style>

:root{

--bg:#F5F5F7;
--card:#FFFFFF;
--text:#111111;
--secondary:#777777;
--line:#E5E5EA;
--accent:#111111;

}


*{

box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;

}


body{

margin:0;
background:var(--bg);
color:var(--text);

}


#app{

padding:

env(safe-area-inset-top)
20px
90px
20px;

max-width:600px;

margin:auto;

}



.page{

display:none;

animation:.25s ease;

}


.page.active{

display:block;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}



.logo{

font-size:32px;

font-weight:800;

letter-spacing:-1px;

}



.card{

background:white;

border-radius:24px;

padding:20px;

margin-bottom:15px;

box-shadow:

0 8px 30px rgba(0,0,0,.05);

}



.title{

font-size:14px;

color:var(--secondary);

}



.big{

font-size:34px;

font-weight:800;

margin-top:8px;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.button{

width:100%;

border:0;

background:#111;

color:white;

padding:15px;

border-radius:18px;

font-size:16px;

}



input,select,textarea{

width:100%;

padding:14px;

border-radius:16px;

border:1px solid var(--line);

margin-top:10px;

font-size:16px;

background:white;

}



.list-item{

background:white;

padding:16px;

border-radius:18px;

margin-bottom:10px;

}



.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:75px;

background:rgba(255,255,255,.9);

backdrop-filter:blur(20px);

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #ddd;

}



.nav{

font-size:12px;

text-align:center;

color:#777;

}



.nav span{

display:block;

font-size:24px;

}



.nav.active{

color:#111;

}



.progress{

height:12px;

background:#eee;

border-radius:20px;

overflow:hidden;

}



.progress div{

height:100%;

background:#111;

}



</style>

</head>


<body>


<div id="app">


<!-- HOME -->

<section id="home" class="page active">


<div class="header">

<div class="logo">
LB CRM
</div>

</div>



<div class="card">

<div class="title">
Текущий капитал
</div>


<div class="big" id="capital">
0 €
</div>


</div>



<div class="grid">


<div class="card">

<div class="title">
Доход
</div>

<div class="big" id="income">
0 €
</div>

</div>


<div class="card">

<div class="title">
Расход
</div>

<div class="big" id="expense">
0 €
</div>

</div>


</div>



<div class="card">

<h3>
💰 Million Tracker
</h3>


<div>

<span id="million">
0
</span>

€ / 1 000 000 €

</div>


<br>


<div class="progress">

<div id="millionBar"></div>

</div>


</div>



<div class="card">

<h3>
Последние действия
</h3>

<div id="activity">

Нет данных

</div>

</div>


</section>
<!-- LEADS -->

<section id="leads" class="page">

<div class="header">
<div class="logo">Leads</div>
</div>


<div class="card">

<h3>
Новый лид
</h3>


<input id="leadName" placeholder="Имя / Компания">

<input id="leadMoney" type="number" placeholder="Стоимость проекта €">


<select id="leadStatus">

<option>Новый</option>
<option>Написал</option>
<option>Созвон</option>
<option>КП</option>
<option>Оплата</option>
<option>Закрыт</option>

</select>


<button class="button" onclick="addLead()">
Добавить лид
</button>


</div>


<div id="leadList"></div>


</section>



<!-- FINANCE -->

<section id="finance" class="page">


<div class="header">

<div class="logo">
Finance
</div>

</div>


<div class="card">

<h3>
Добавить операцию
</h3>


<input id="financeAmount" type="number" placeholder="Сумма €">


<select id="financeType">

<option value="income">
Доход
</option>

<option value="expense">
Расход
</option>


</select>


<button class="button" onclick="addFinance()">

Добавить

</button>


</div>


<div id="financeList"></div>


</section>




<!-- GOALS -->


<section id="goals" class="page">


<div class="header">

<div class="logo">
Goals
</div>

</div>



<div class="card">

<h3>
Новая цель
</h3>


<input id="goalName" placeholder="Например BMW">


<input id="goalTarget" type="number" placeholder="Сумма €">


<button class="button" onclick="addGoal()">

Создать

</button>


</div>



<div id="goalList"></div>


</section>




<!-- SETTINGS -->


<section id="settings" class="page">


<div class="header">

<div class="logo">
Settings
</div>

</div>



<div class="card">


<h3>
LB CRM
</h3>


<p>
Personal Business CRM
</p>


<button class="button" onclick="clearData()">

Очистить данные

</button>


</div>


</section>



</div>



<!-- BOTTOM NAV -->


<div class="bottom">


<div class="nav active" onclick="openPage('home',this)">
<span>🏠</span>
Home
</div>


<div class="nav" onclick="openPage('leads',this)">
<span>👥</span>
Leads
</div>


<div class="nav" onclick="openPage('finance',this)">
<span>💶</span>
Finance
</div>


<div class="nav" onclick="openPage('goals',this)">
<span>🎯</span>
Goals
</div>


<div class="nav" onclick="openPage('settings',this)">
<span>⚙️</span>
Settings
</div>


</div>




<script>


let db =
JSON.parse(
localStorage.getItem("LBCRM")
)
||
{

income:0,

expense:0,

leads:[],

finance:[],

goals:[]

};



function save(){

localStorage.setItem(
"LBCRM",
JSON.stringify(db)
);

}



function openPage(id,el){

document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");


document
.querySelectorAll(".nav")
.forEach(
n=>n.classList.remove("active")
);


el.classList.add("active");


}




function render(){


let capital =
db.income-db.expense;


document.getElementById("income")
.innerHTML =
db.income+" €";


document.getElementById("expense")
.innerHTML =
db.expense+" €";


document.getElementById("capital")
.innerHTML =
capital+" €";


document.getElementById("million")
.innerHTML =
capital;


document.getElementById("millionBar")
.style.width =
Math.min(capital/1000000*100,100)
+"%";



document.getElementById("leadList")
.innerHTML =
db.leads.map(
(l,i)=>

`

<div class="list-item">

<b>${l.name}</b>

<br>

${l.status}

<br>

${l.money} €

</div>

`

).join("");





document.getElementById("financeList")
.innerHTML =
db.finance.map(

(f)=>

`

<div class="list-item">

${f.type}
<br>
${f.amount} €

</div>

`

).join("");





document.getElementById("goalList")
.innerHTML =
db.goals.map(

(g)=>

`

<div class="list-item">

<b>${g.name}</b>

<br>

${g.target} €

</div>

`

).join("");

}



function addLead(){

db.leads.push({

name:
leadName.value,

money:
Number(leadMoney.value),

status:
leadStatus.value

});


save();

render();

}



function addFinance(){

let amount =
Number(financeAmount.value);


if(financeType.value==="income"){

db.income+=amount;

}

else{

db.expense+=amount;

}


db.finance.push({

type:financeType.value,

amount

});


save();

render();

}




function addGoal(){

db.goals.push({

name:
goalName.value,

target:
Number(goalTarget.value)

});


save();

render();

}




function clearData(){

localStorage.clear();

location.reload();

}



render();



if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}


</script>


</body>

</html>
